name: helvetic-lens-retrieval
services:
  embeddings:
    image: helvetic-lens-retrieval:e5-small-614241f-1
    build: .
    restart: unless-stopped
    cpus: 2
    mem_limit: 3g
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    volumes:
      - ${LAYA_SECRET_FILE:?Use the existing protected local token}:/run/secrets/local_key:ro
    networks:
      model-control:
        aliases: [helvetic-lens-retrieval]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
networks:
  model-control:
    external: true
    name: helvetic-lens_model-control
