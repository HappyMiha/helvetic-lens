services:
  # Keep direct exposure available only when the operator explicitly enables it.
  caddy:
    profiles: ["direct"]

  cloudflared:
    image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    user: "${CLOUDFLARED_UID:-1000}:${CLOUDFLARED_GID:-1000}"
    working_dir: /tmp
    environment:
      HOME: /tmp
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --metrics
      - 0.0.0.0:20241
      - run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}
