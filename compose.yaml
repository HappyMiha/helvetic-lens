name: apertus-regwatch
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: regwatch
      POSTGRES_PASSWORD: regwatch
      POSTGRES_DB: regwatch
    ports:
      - "127.0.0.1:${REGWATCH_DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regwatch"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://regwatch:regwatch@db:5432/regwatch
      REGWATCH_DATA_DIR: /data
    ports:
      - "127.0.0.1:${REGWATCH_API_PORT:-8000}:8000"
    volumes:
      - document_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        REGWATCH_API_URL: http://api:8000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${REGWATCH_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
  local-apertus:
    profiles: ["local-ai"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    ports:
      - "127.0.0.1:${LOCAL_APERTUS_PORT:-12435}:8080"
    volumes:
      - local_apertus_cache:/root/.cache
      - ./deploy/apertus-v1-chat-template.jinja:/templates/apertus-v1-chat-template.jinja:ro
    command:
      - -hf
      - MrMeOrYou/Apertus-v1.1-1.5B-Instruct-GGUF:BF16
      - --alias
      - local-apertus
      - --chat-template-file
      - /templates/apertus-v1-chat-template.jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --n-predict
      - "700"
      - --n-gpu-layers
      - "99"
volumes:
  postgres_data:
  document_data:
  local_apertus_cache:
