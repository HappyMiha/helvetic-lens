name: helvetic-lens
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${HELVETIC_LENS_DB_USER:-helvetic_lens}
      POSTGRES_PASSWORD: ${HELVETIC_LENS_DB_PASSWORD:-helvetic_lens}
      POSTGRES_DB: ${HELVETIC_LENS_DB_NAME:-helvetic_lens}
    ports:
      - "127.0.0.1:${HELVETIC_LENS_DB_PORT:-${REGWATCH_DB_PORT:-54329}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HELVETIC_LENS_DB_USER:-helvetic_lens} -d ${HELVETIC_LENS_DB_NAME:-helvetic_lens}",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${HELVETIC_LENS_REDIS_PORT:-63799}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${HELVETIC_LENS_DB_USER:-helvetic_lens}:${HELVETIC_LENS_DB_PASSWORD:-helvetic_lens}@db:5432/${HELVETIC_LENS_DB_NAME:-helvetic_lens}
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTION_MODE: celery
      HELVETIC_LENS_DATA_DIR: /data
      MODEL_MANAGER_URL: http://model-manager:8090
    ports:
      - "127.0.0.1:${HELVETIC_LENS_API_PORT:-${REGWATCH_API_PORT:-8000}}:8000"
    volumes:
      - document_data:/data
    networks:
      - default
      - model-control
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  worker-cpu:
    build:
      context: services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${HELVETIC_LENS_DB_USER:-helvetic_lens}:${HELVETIC_LENS_DB_PASSWORD:-helvetic_lens}@db:5432/${HELVETIC_LENS_DB_NAME:-helvetic_lens}
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTION_MODE: celery
      HELVETIC_LENS_DATA_DIR: /data
      MODEL_MANAGER_URL: http://model-manager:8090
    command: ["celery", "-A", "helvetic_lens.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "interactive,ingest,parse_diff,maintenance", "--concurrency=2"]
    volumes:
      - document_data:/data
    networks:
      - default
      - model-control
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker-ai:
    build:
      context: services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${HELVETIC_LENS_DB_USER:-helvetic_lens}:${HELVETIC_LENS_DB_PASSWORD:-helvetic_lens}@db:5432/${HELVETIC_LENS_DB_NAME:-helvetic_lens}
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTION_MODE: celery
      HELVETIC_LENS_DATA_DIR: /data
      MODEL_MANAGER_URL: http://model-manager:8090
    command: ["celery", "-A", "helvetic_lens.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "ai_interactive,ai_background", "--concurrency=1"]
    volumes:
      - document_data:/data
    networks:
      - default
      - model-control
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    build:
      context: services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${HELVETIC_LENS_DB_USER:-helvetic_lens}:${HELVETIC_LENS_DB_PASSWORD:-helvetic_lens}@db:5432/${HELVETIC_LENS_DB_NAME:-helvetic_lens}
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTION_MODE: celery
      HELVETIC_LENS_DATA_DIR: /data
    command: ["celery", "-A", "helvetic_lens.celery_app:celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - document_data:/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        HELVETIC_LENS_API_URL: http://api:8000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${HELVETIC_LENS_WEB_PORT:-${REGWATCH_WEB_PORT:-3000}}:3000"
    depends_on:
      api:
        condition: service_healthy
  model-manager:
    build:
      context: .
      dockerfile: services/model-manager/Dockerfile
    gpus: all
    environment:
      MODEL_MANAGER_CATALOG: /manager/catalog.json
      MODEL_MANAGER_LIBRARY: /models
      MODEL_MANAGER_LLAMA_SERVER: /app/llama-server
      MODEL_MANAGER_RUNTIME_IMAGE: ghcr.io/ggml-org/llama.cpp@sha256:031c0058432ab0769057273cdfda45848d00fef11e993448eef98c7ebb45a8c6
    ports:
      - "127.0.0.1:${MODEL_MANAGER_PORT:-12436}:8090"
    volumes:
      - model_library:/models
      - local_apertus_cache:/legacy-cache:ro
    networks:
      - default
      - model-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  postgres_data:
    name: ${HELVETIC_LENS_POSTGRES_VOLUME:-helvetic-lens_postgres_data}
  document_data:
    name: ${HELVETIC_LENS_DOCUMENT_VOLUME:-helvetic-lens_document_data}
  local_apertus_cache:
    name: ${HELVETIC_LENS_APERTUS_VOLUME:-helvetic-lens_local_apertus_cache}
  model_library:
    name: ${HELVETIC_LENS_MODEL_LIBRARY_VOLUME:-helvetic-lens_model_library}
  redis_data:
    name: ${HELVETIC_LENS_REDIS_VOLUME:-helvetic-lens_redis_data}
networks:
  model-control:
    internal: true
