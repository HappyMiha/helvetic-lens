[project]
name = "helvetic-lens-api"
version = "0.1.0"
description = "Regulatory source monitoring and evidence-backed version comparisons"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.37,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "beautifulsoup4>=4.13,<5",
  "pdfminer.six>=20260107,<20270000",
  "python-multipart>=0.0.20,<1",
  "celery[redis]>=5.5,<6",
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<47",
]

[project.scripts]
helvetic-lens-admin = "helvetic_lens.admin_cli:main"
helvetic-lens-capacity-seed = "helvetic_lens.capacity_seed:main"
helvetic-lens-capacity-cleanup = "helvetic_lens.capacity_cleanup:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4.4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helvetic_lens"]

[tool.hatch.build.targets.sdist]
include = ["/helvetic_lens", "/alembic", "/alembic.ini", "/pyproject.toml", "/uv.lock", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
